# Validates Rust changes and PostgreSQL-backed checks before and after merging.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crow_auth_ci
          POSTGRES_DB: crow_auth_ci
          # Disposable CI fixture only; never used for development or production.
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U crow_auth_ci -d crow_auth_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.27.0
        env:
          MP_MAX_MESSAGES: 100
        ports:
          - 127.0.0.1:1025:1025
          - 127.0.0.1:8025:8025
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Check compilation
        run: cargo check --locked
      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Check account persistence and database races
        env:
          TEST_DATABASE_URL: postgres://crow_auth_ci:ci-only-password@127.0.0.1:5432/crow_auth_ci
        run: cargo test --locked --test accounts_database -- --ignored
      - name: Check verification actions and activation races
        env:
          TEST_DATABASE_URL: postgres://crow_auth_ci:ci-only-password@127.0.0.1:5432/crow_auth_ci
        run: cargo test --locked --test verification_database -- --ignored
      - name: Check encrypted outbox and SMTP capture delivery
        env:
          TEST_DATABASE_URL: postgres://crow_auth_ci:ci-only-password@127.0.0.1:5432/crow_auth_ci
          TEST_SMTP_PORT: 1025
          TEST_MAILPIT_URL: http://127.0.0.1:8025
        run: cargo test --locked --test mail_database -- --ignored
      - name: Check resend, cleanup and cross-operation races
        env:
          TEST_DATABASE_URL: postgres://crow_auth_ci:ci-only-password@127.0.0.1:5432/crow_auth_ci
          TEST_SMTP_PORT: 1025
          TEST_MAILPIT_URL: http://127.0.0.1:8025
        run: cargo test --locked --test lifecycle_database -- --ignored
      - name: Check signed-cookie CSRF and verification action integration
        env:
          TEST_DATABASE_URL: postgres://crow_auth_ci:ci-only-password@127.0.0.1:5432/crow_auth_ci
        run: cargo test --locked --test browser_verification -- --ignored
      - name: Check shared registration/resend throttling and races
        env:
          TEST_DATABASE_URL: postgres://crow_auth_ci:ci-only-password@127.0.0.1:5432/crow_auth_ci
        run: cargo test --locked --test throttle_database -- --ignored
      - name: Check database startup and HTTP health
        env:
          DATABASE_URL: postgres://crow_auth_ci:ci-only-password@127.0.0.1:5432/crow_auth_ci
        run: bash .github/scripts/smoke-test.sh
