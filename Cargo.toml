[package]
name = "crow-auth"
version = "0.1.0"
edition = "2024"
default-run = "crow-auth"

[dependencies]
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util"] }
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
chacha20poly1305 = "0.10"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
